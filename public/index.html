<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FridgeTinder - Log in</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23fd297b'/%3E%3Cstop offset='1' stop-color='%23ff655b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Crect x='6.5' y='3.5' width='11' height='17' rx='1.8' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3Cline x1='6.5' y1='9' x2='17.5' y2='9' stroke='%23fff' stroke-width='1.6'/%3E%3Cpath d='M12 11.2c1.9 1.7 2.8 3 2.8 4.5a2.8 2.8 0 0 1-5.6 0c0-1 .4-1.8 1-2.6.2.5.4.9.8 1.2-.2-1.1.1-2.1 1-3.1z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <div class="login-hero">
    <div class="login-brand">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="5" y="2" width="14" height="20" rx="2" stroke="#fff" stroke-width="1.8" />
        <line x1="5" y1="8.5" x2="19" y2="8.5" stroke="#fff" stroke-width="1.8" />
        <path d="M12 10.8c2.1 1.9 3.1 3.3 3.1 5a3.1 3.1 0 0 1-6.2 0c0-1.1.45-2 1.1-2.9.2.55.45 1 .9 1.35-.25-1.2.1-2.3 1.1-3.45z" fill="#fff" />
      </svg>
      <h1>FridgeTinder</h1>
      <p>Single ingredients in your area are looking to combine.<br />Scan. Match. Cook.</p>
    </div>

    <div class="login-card">
      <input type="email" id="email" placeholder="Email" autocomplete="email" />
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
      <div id="err" class="banner err hidden"></div>
      <button class="btn tinder" id="loginBtn">Log in</button>
      <p class="hint center" style="color:rgba(255,255,255,0.85)">
        New here? Logging in for the first time creates your account.
      </p>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
